<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora online gratuita con números aleatorios y operaciones aritméticas: suma, resta, multiplicación y división. ¡Prueba ahora!">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://tu-sitio.com">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <title>Calcu - Calculadora Interactiva con Operaciones Aritméticas</title>
    <link rel="stylesheet" href="css/index.css">
    <meta property="og:title" content="Calcu - Calculadora Interactiva">
    <meta property="og:description" content="Calculadora online con números aleatorios y operaciones aritméticas: suma, resta, multiplicación y división.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tu-sitio.com">
    <meta property="og:image" content="https://tu-sitio.com/og-image.jpg">
    <meta property="og:site_name" content="Calcu">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Calcu - Calculadora Interactiva">
    <meta name="twitter:description" content="Calculadora online con números aleatorios y operaciones aritméticas.">
    <meta name="twitter:image" content="https://tu-sitio.com/twitter-image.jpg">
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Calcu",
  "description": "Calculadora interactiva con números aleatorios y operaciones aritméticas",
  "applicationCategory": "EducationalApplication",
  "operatingSystem": "Web",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "author": {
    "@type": "Organization",
    "name": "Calcu Team"
  }
}
</script>
</head>
<body>
    <main class="calculator">
        <!-- Numeros aleatorios -->
        <h1 class="calculator__title">Numeros Aleatorios</h1>
         <section class="calculator__numbers">
            <span class="calculator__number" id="numero1">0</span>
            <span class="calculator__number" id="numero2">0</span>
         </section>

         <!-- Button de numeros aleatorio -->
         <button class="calculator__button calculator__button--random" id="btnAleatorio">Numeros aleatorios</button>
        <!-- Resultados de las operaciones arriba de los btn de las operaciones -->
        <section class="calculator__results" id="resultados">
            <!-- Zona resultado -->
             <section class="calculator__results-zone">
                <h2 class="calculator__results-title">Resultados:</h2>
                <p class="calculator__result" id="resultadoSuma">Suma:</p>
                <p class="calculator__result" id="resultadoResta">Resta: </p>
                <p class="calculator__result" id="resultadoMultiplicacion">Multiplicacion: </p>
                <p class="calculator__result" id="resultadoDivision">Division: </p>
             </section>
            <!-- Zona botones operaciones -->
            <div class="operation__container">
                
                    <button class="calculator__button calculator__btn--operation calculator__button--sum" id="suma">Suma</button>
                    <button class="calculator__button calculator__btn--operation calculator__button--rest" id="resta">Resta</button>
                
                
                    <button class="calculator__button calculator__btn--operation calculator__button--multiply" id="multiplicacion">Multiplicacion</button>
                    <button class="calculator__button calculator__btn--operation calculator__button--divide" id="division">Division</button>
            </div>

        </section>

    <script type="module" src="js/index.js"></script>
    </main>
</body>
</html>
